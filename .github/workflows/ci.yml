# Integración continua de la app móvil PAEGo.
# Análisis estático, pruebas con cobertura y compilación de web y APK en cada
# push y pull request.
name: CI app móvil

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.4"
  # URL de la API para los builds de CI (variable del repositorio opcional).
  PAEGO_API_URL: ${{ vars.PAEGO_API_URL || 'https://web-production-9a3cf.up.railway.app' }}
  # Clave de los mapas base de ArcGIS (secreto opcional; sin ella se usa OpenStreetMap).
  ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
  # Cobertura real de lib/ (con las pantallas). Subirla a medida que se agregan pruebas.
  COBERTURA_MINIMA: "25"

jobs:
  calidad:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # .env es un asset declarado en pubspec.yaml: sin él no compila.
      - name: Crear .env de CI
        run: echo "PAEGO_API_URL=$PAEGO_API_URL" > .env && echo "ARCGIS_API_KEY=$ARCGIS_API_KEY" >> .env
      - run: flutter pub get
      - name: Análisis estático (cualquier aviso bloquea)
        run: flutter analyze
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      # Sin esto la cobertura solo cuenta los archivos que alguna prueba
      # importa: las pantallas sin pruebas no aparecen y el número se infla.
      - name: Incluir en la cobertura todos los archivos de lib/
        run: |
          find lib -name '*.dart' | sort \
            | sed -e "s#^lib/#import 'package:opaego/#" -e "s#\$#';#" > test/cobertura_todos_test.dart
          echo 'void main() {}' >> test/cobertura_todos_test.dart
      - name: Pruebas con cobertura
        run: flutter test --coverage --reporter expanded
      - name: Cobertura mínima
        run: |
          awk -F: -v min="$COBERTURA_MINIMA" '/^LF:/{t+=$2} /^LH:/{c+=$2} END{
            p = 100*c/t
            printf "### Cobertura de pruebas: %d de %d líneas (%.1f %%), mínimo %s %%\n", c, t, p, min
            if (p < min) exit 1
          }' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-app
          path: coverage/lcov.info
          retention-days: 14

  web:
    name: Build web
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: echo "PAEGO_API_URL=$PAEGO_API_URL" > .env && echo "ARCGIS_API_KEY=$ARCGIS_API_KEY" >> .env
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: paego-web
          path: build/web
          retention-days: 7

  android:
    name: Build APK
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: echo "PAEGO_API_URL=$PAEGO_API_URL" > .env && echo "ARCGIS_API_KEY=$ARCGIS_API_KEY" >> .env
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: paego-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # Prueba de punta a punta: la capa de datos de la app (login, cola sin
  # conexión, envíos) contra el backend real de oPAEGo con PostgreSQL.
  # Rama del backend: variable de repositorio OPAEGO_REF. Por defecto la rama de
  # integración del backend; pasar a main cuando se fusione en oPAEGo.
  e2e:
    name: Punta a punta con el backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pae_go
          POSTGRES_USER: pae_user
          POSTGRES_PASSWORD: pae_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pae_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pae_user:pae_password@localhost:5432/pae_go
      PAEGO_E2E_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dania2204/oPAEGo
          ref: ${{ vars.OPAEGO_REF || 'feature/plataforma-web' }}
          path: oPAEGo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: oPAEGo/backend/requirements.txt
      - name: Levantar el backend con datos de demostración
        working-directory: oPAEGo/backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_demo
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../../servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/api/schema/ && exit 0
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/schema/ | grep -q 401 && exit 0
            sleep 1
          done
          cat ../../servidor.log; exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: echo "PAEGO_API_URL=$PAEGO_E2E_URL" > .env
      - run: flutter pub get
      - name: Flujo completo de un envío
        run: flutter test test/e2e --reporter expanded
      - name: Registro del servidor
        if: failure()
        run: cat servidor.log || echo "El servidor no llegó a arrancar."
